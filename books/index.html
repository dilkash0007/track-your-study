<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Directory - Track Your Study</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            color: #2563eb;
        }

        .books-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .book-item {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .book-item a {
            display: block;
            padding: 1rem;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 500;
        }

        .book-info {
            padding: 0 1rem 1rem;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .pdf-icon {
            color: #ef4444;
            margin-right: 0.5rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Study Books Directory</h1>
    <p>This directory contains PDF books for your study needs. Click on any file to view it.</p>

    <div class="books-container" id="books-list">
        <!-- Books will be populated dynamically by JavaScript -->
    </div>

    <script>
        // Simple script to list PDF files
        window.addEventListener('DOMContentLoaded', () => {
            const booksList = document.getElementById('books-list');

            // Fetch the current directory
            fetch('./')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const links = Array.from(doc.querySelectorAll('a'));

                    // Filter to just show PDF files
                    const pdfLinks = links.filter(link => {
                        const href = link.getAttribute('href');
                        return href && href.toLowerCase().endsWith('.pdf');
                    });

                    if (pdfLinks.length === 0) {
                        booksList.innerHTML = '<p>No PDF books found in this directory.</p>';
                        return;
                    }

                    // Create elements for each PDF
                    pdfLinks.forEach(link => {
                        const filename = link.textContent;
                        if (filename === 'Parent Directory') return;

                        const bookItem = document.createElement('div');
                        bookItem.className = 'book-item';

                        const bookLink = document.createElement('a');
                        bookLink.href = link.href;
                        bookLink.innerHTML = `<span class="pdf-icon">PDF</span> ${filename}`;

                        const bookInfo = document.createElement('div');
                        bookInfo.className = 'book-info';
                        bookInfo.textContent = 'Click to view or download';

                        bookItem.appendChild(bookLink);
                        bookItem.appendChild(bookInfo);
                        booksList.appendChild(bookItem);
                    });
                })
                .catch(error => {
                    console.error('Error loading directory:', error);
                    booksList.innerHTML = `<p>Error loading books: ${error.message}</p>`;
                });
        });
    </script>
</body>

</html>
